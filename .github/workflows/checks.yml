name: Tests and dependency audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/activity-command-smoke.cjs
      - run: node tools/cancel-smoke.cjs
      - run: node tools/drive-safety-smoke.cjs
      - run: node tools/tray-smoke.cjs
      - run: npm audit --audit-level=low
